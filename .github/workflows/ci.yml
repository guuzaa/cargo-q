name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        toolchain: ${{ matrix.os == 'macos-latest' && '1.75.0' || 'stable' }}
    
    - name: Check formatting
      if: matrix.os == 'ubuntu-latest'
      run: cargo fmt -- --check
    
    - name: Cargo cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
            ${{ runner.os }}-cargo-
    
    - name: Build on ${{ matrix.os }}
      run: cargo build --verbose
    
    - name: Run tests on ${{ matrix.os }}
      run: cargo test --verbose
    
    - name: Run clippy
      if: matrix.os != 'windows-latest'
      run: cargo clippy -- -D warnings

    - name: Install the wasm32 target
      if: matrix.os == 'ubuntu-latest'
      run: rustup target add wasm32-unknown-unknown

    - name: Check the wasm32 build
      if: matrix.os == 'ubuntu-latest'
      run: cargo check --target wasm32-unknown-unknown

    - name: Run clippy on the wasm32 build
      if: matrix.os == 'ubuntu-latest'
      run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

  page:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 12.14.0

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: page/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      working-directory: page

    - name: Check the page
      run: pnpm check
      working-directory: page

    - name: Build the page
      run: pnpm build
      working-directory: page
