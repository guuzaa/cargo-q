[package]
name = "cargo-q"
version = "0.2.3"
edition = "2021"
rust-version = "1.78"
description = "A Cargo subcommand for running multiple Cargo commands sequentially or in parallel."
keywords = ["cargo", "subcommand", "plugin"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
license = "Apache-2.0"
readme = "README.md"
authors = ["Jowell Young <guza@duck.com>"]
repository = "https://github.com/guuzaa/cargo-q"
exclude = [".github", ".vscode", ".gitignore", "CHANGELOG.md"]
documentation = "https://docs.rs/cargo-q"

[dependencies]
clap = { version = "4.5.26", features = ["derive"] }
ctrlc = "3.4"
os_pipe = "1.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 2
lto = "thin"
